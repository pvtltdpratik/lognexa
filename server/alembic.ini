# Alembic configuration for Lognexa.
# The database URL is NOT set here; migrations/env.py reads LOGNEXA_DATABASE_URL
# through app.config so credentials stay in server/.env.
#
#   .venv\Scripts\python -m alembic upgrade head      apply all migrations
#   .venv\Scripts\python -m alembic current           show the applied revision
#   .venv\Scripts\python -m scripts.migrate           same as upgrade, but also adopts
#                                                     databases created before Alembic

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
